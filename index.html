<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI乐子</title>
    <!-- 仅浏览器标签页左上角favicon：白底黑字“乐” -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32'><rect width='32' height='32' fill='white'/><text x='16' y='24' font-size='22' text-anchor='middle' fill='black'>乐</text></svg>">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui;}
        body{background:#16213e;color:#fff;padding:20px;}
        .container{max-width:850px;margin:0 auto;}
        h1{
            text-align:center;
            color:#63aaff;
            margin-bottom:20px;
            font-size:24px;
        }
        .chat-box{background:#1a2b4d;border-radius:12px;padding:16px;min-height:480px;max-height:580px;overflow-y:auto;margin-bottom:15px;}
        .msg{margin:10px 0;display:flex;}
        .msg.ai{justify-content:flex-start;}
        .msg.me{justify-content:flex-end;}
        .bubble{max-width:72%;padding:12px 16px;border-radius:14px;line-height:1.5;word-wrap:break-word;}
        .ai .bubble{background:#283b64;}
        .me .bubble{background:#2068d0;}
        .input-area{display:flex;gap:10px;}
        #input{flex:1;padding:12px 14px;border-radius:8px;border:none;background:#223359;color:#fff;outline:none;font-size:16px;}
        .btn{padding:12px 18px;border:none;border-radius:8px;background:#3478e8;color:#fff;cursor:pointer;font-size:15px;}
        .btn:hover{background:#2962c2;}
        .btn.listening{background:#c82423;}
        .footer{text-align:center;margin-top:16px;color:#94a3c7;font-size:13px;}
    </style>
</head>
<body>
<div class="container">
    <h1>AI 乐子</h1>
    <div class="chat-box" id="chatbox"></div>
    <div class="input-area">
        <input id="input" placeholder="在这里输入消息，回车发送，可以输入算式计算">
        <button class="btn" id="micBtn">🎤</button>
        <button class="btn" id="sendBtn">发送</button>
    </div>
    <div class="footer">©2026 大风大浪集团版权所有</div>
</div>
<script>
const chatbox = document.getElementById('chatbox');
const inputDom = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
let recognition = null;
let isListen = false;

// ========== 关键词知识库 ==========
const keywordReplies = [
    { keys:["你好","嗨","哈喽","hi","hello","早上好","下午好","晚上好"], replies:["你好呀！很高兴和你聊天~","嗨！今天有什么想聊的？"]},
    { keys:["傻逼","sb","傻b","脏话","骂人","滚","讨厌你","去死"], replies:["请文明聊天，不要说不友好的话语。","我们好好沟通，不要使用不好的词语。"]},
    { keys:["你是谁","你叫什么"], replies:["我叫乐子，是大风大浪集团开发的网页聊天机器人。"]}
];

// 兜底回复
const fallbackReplies = [
    "哈哈，原来是这样，继续说说吧。",
    "这个话题很有意思，再多讲讲。",
    "我在听，你继续说。"
];

// 打字机效果
async function typeWrite(el, text, speed=35){
    el.innerHTML = "";
    for(let ch of text){
        el.innerHTML += ch;
        chatbox.scrollTop = chatbox.scrollHeight;
        await new Promise(r=>setTimeout(r, speed));
    }
}

// 添加消息气泡
function addMsg(text, isMe=false){
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + (isMe?'me':'ai');
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    wrap.appendChild(bubble);
    chatbox.appendChild(wrap);
    chatbox.scrollTop = chatbox.scrollHeight;
    return bubble;
}

// 关键词匹配
function matchKeyword(text){
    const low = text.toLowerCase();
    for(let item of keywordReplies){
        for(let kw of item.keys){
            if(low.includes(kw.toLowerCase())){
                const idx = Math.floor(Math.random()*item.replies.length);
                return item.replies[idx];
            }
        }
    }
    return null;
}

// 简单数学算式匹配
function calcMath(text){
    const reg = /[-+*/()0-9. ]+/;
    const m = text.match(reg);
    if(!m) return null;
    const expr = m[0].trim();
    if(!/^[0-9+\-*/(). ]+$/.test(expr)) return null;
    try{
        const res = Function('"use strict";return ('+expr+')')();
        if(!isFinite(res)) return null;
        return `算式 ${expr} = ${res}`;
    }catch(e){return null;}
}

// 发送消息主逻辑
async function sendMessage(){
    const txt = inputDom.value.trim();
    if(!txt) return;
    inputDom.value = "";
    addMsg(txt, true);

    //1.数学计算优先
    const mathRes = calcMath(txt);
    if(mathRes){
        const bubble = addMsg("", false);
        await typeWrite(bubble, mathRes);
        return;
    }

    //2.关键词匹配
    const kwAns = matchKeyword(txt);
    if(kwAns){
        const bubble = addMsg("", false);
        await typeWrite(bubble, kwAns);
        return;
    }

    //3.兜底回复
    const bubble = addMsg("", false);
    const ans = fallbackReplies[Math.floor(Math.random()*fallbackReplies.length)];
    await typeWrite(bubble, ans);
}

//语音识别
if(window.webkitSpeechRecognition){
    recognition = new window.webkitSpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'zh‑CN';
    recognition.onresult = e=>{
        const text = e.results[0][0].transcript;
        inputDom.value = text;
    };
    recognition.onend = ()=>{
        isListen = false;
        micBtn.classList.remove('listening');
    }
}

micBtn.onclick = ()=>{
    if(!recognition){alert("你的浏览器不支持语音识别");return;}
    if(isListen){
        recognition.stop();
    }else{
        isListen=true;
        micBtn.classList.add('listening');
        recognition.start();
    }
}

sendBtn.onclick = sendMessage;
inputDom.onkeydown = e=>{
    if(e.key==='Enter') sendMessage();
}

//页面加载自动发送开场白
window.addEventListener('load', async ()=>{
    const bubble = addMsg("", false);
    await typeWrite(bubble, "我是人工智障乐子，很高兴为您服务。");
});
</script>
</body>
</html>
