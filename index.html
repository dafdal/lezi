//语音识别配置
let recognition = null;
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = "zh-CN";
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onresult = function(event) {
        const text = event.results[0][0].transcript;
        inputDom.value = text;
        voiceBtn.classList.remove("listening");
    };
    recognition.onerror = function(){
        voiceBtn.classList.remove("listening");
    };
    recognition.onend = function(){
        voiceBtn.classList.remove("listening");
    };
}

//麦克风按钮点击事件
voiceBtn.onclick = function(){
    if(!recognition){
        alert("你的浏览器不支持语音输入");
        return;
    }
    if(voiceBtn.classList.contains("listening")){
        recognition.stop();
        voiceBtn.classList.remove("listening");
    }else{
        voiceBtn.classList.add("listening");
        recognition.start();
    }
};

//打字机输出函数
async function typeWrite(element, text, speed=35){
    element.innerHTML = "";
    for(let i=0;i<text.length;i++){
        element.innerHTML += text.charAt(i);
        chatbox.scrollTop = chatbox.scrollHeight;
        await new Promise(resolve=>setTimeout(resolve,speed));
    }
}

// 计算引擎：支持括号、四则运算、小数
function calcExpression(expr){
    expr = expr.replace(/\s+/g,"");
    if(!/^[0-9+\-*/().]+$/.test(expr)) return null;

    function calcSimple(str){
        let mulDiv = str.split(/([*/])/);
        let val = parseFloat(mulDiv[0]);
        for(let i=1;i<mulDiv.length;i+=2){
            let op = mulDiv[i];
            let num = parseFloat(mulDiv[i+1]);
            if(op === "*") val *= num;
            if(op === "/"){
                if(Math.abs(num)<1e-12) return NaN;
                val /= num;
            }
        }
        return val;
    }

    while(expr.includes("(")){
        let left = expr.lastIndexOf("(");
        let right = expr.indexOf(")",left);
        if(right === -1) return null;
        let sub = expr.slice(left+1,right);
        let v = calcSimple(sub);
        if(isNaN(v)) return null;
        expr = expr.slice(0,left)+v+expr.slice(right+1);
    }

    let parts = expr.split(/([+-])/);
    let res = parseFloat(parts[0]);
    for(let i=1;i<parts.length;i+=2){
        let op = parts[i];
        let num = parseFloat(parts[i+1]);
        if(op === "+") res += num;
        if(op === "-") res -= num;
    }
    if(!isFinite(res)) return null;
    res = Math.round(res*100000)/100000;
    return res;
}

function tryCalcMath(text){
    //提取算式
    const mathPattern = /[\d+\-*/().]{3,}/g;
    const matches = text.match(mathPattern);
    if(!matches) return null;
    for(let exp of matches){
        let result = calcExpression(exp);
        if(result!==null){
            return `${exp} = ${result}`;
        }
    }
    return null;
}

//获取AI回复
function getAiReply(userInput){
    const mathAns = tryCalcMath(userInput);
    if(mathAns !== null){
        return mathAns;
    }
    const lowerText = userInput.toLowerCase();
    for(let group of keywordReplies){
        for(let kw of group.keys){
            if(lowerText.includes(kw)){
                return group.replies[Math.floor(Math.random()*group.replies.length)];
            }
        }
    }
    return fallbackReplies[Math.floor(Math.random()*fallbackReplies.length)];
}

function sendMsg(){
    let text = inputDom.value.trim();
    if(!text) return;
    chatbox.innerHTML += `<div class="msg me"><div class="bubble">${escapeHtml(text)}</div></div>`;
    inputDom.value = "";
    chatbox.scrollTop = chatbox.scrollHeight;

    setTimeout(async ()=>{
        let aiAnswer = getAiReply(text);
        const aiMsgDiv = document.createElement("div");
        aiMsgDiv.className = "msg ai";
        aiMsgDiv.innerHTML = `<div class="bubble"></div>`;
        chatbox.appendChild(aiMsgDiv);
        const bubbleDom = aiMsgDiv.querySelector(".bubble");
        await typeWrite(bubbleDom, escapeHtml(aiAnswer),35);
    },400);
}

function escapeHtml(str) {
    return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

sendBtn.onclick = sendMsg;
inputDom.onkeydown = function(e){
    if(e.key === "Enter") sendMsg();
