<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#04060d">
<title>AI乐子 - 智能聊天</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap">
<style>
:root{
  --bg0:#04060d; --bg1:#070b18; --bg2:#0b1226; --bg3:#0e162c;
  --ink:#e9f1ff; --mut:#8ea3c9; --dim:#5c7096;
  --cy:#21e6ff; --bl:#3d7bff; --vi:#8a5cff; --pk:#ff2e88;
  --line:rgba(116,154,255,.14);
  --grad:linear-gradient(100deg,#21e6ff 0%,#3d7bff 45%,#8a5cff 100%);
  --font-d:"Orbitron","Noto Sans SC",sans-serif;
  --font-c:"Noto Sans SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--font-c);background:var(--bg0);color:var(--ink);line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
::selection{background:rgba(33,230,255,.28);color:#fff}
::-webkit-scrollbar{width:9px}
::-webkit-scrollbar-track{background:#05070f}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#21e6ff,#3d7bff);border-radius:6px;border:2px solid #05070f}
a{color:inherit}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
/* ===== 背景层 ===== */
.bg-glow{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(62vw 48vw at 82% -8%,rgba(61,123,255,.12),transparent 60%),radial-gradient(52vw 42vw at 6% 34%,rgba(138,92,255,.09),transparent 62%),radial-gradient(44vw 40vw at 50% 108%,rgba(33,230,255,.07),transparent 60%)}
#fx{position:fixed;inset:0;z-index:60;pointer-events:none;opacity:.85}
.cursor{position:fixed;width:540px;height:540px;left:0;top:0;z-index:61;pointer-events:none;background:radial-gradient(circle,rgba(33,230,255,.09),transparent 62%);mix-blend-mode:screen;border-radius:50%;transform:translate(-1000px,-1000px)}
@media (pointer:coarse){.cursor{display:none}}
/* ===== 顶栏 ===== */
header{position:fixed;top:0;left:0;right:0;z-index:900;display:flex;justify-content:space-between;align-items:center;padding:0 clamp(12px,3vw,40px);height:72px;border-bottom:1px solid transparent;transition:.35s}
header.scrolled{background:rgba(5,8,18,.78);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom-color:var(--line);box-shadow:0 8px 30px rgba(2,4,10,.5)}
.logo{display:flex;align-items:center;gap:13px;text-decoration:none}
.logo .mark{width:42px;height:42px;flex:none;border-radius:50%;object-fit:cover;border:1px solid rgba(33,230,255,.45);box-shadow:0 0 14px rgba(33,230,255,.35)}
.logo .lt{display:flex;flex-direction:column;line-height:1.15}
.logo .lt b{font-size:20px;font-weight:900;letter-spacing:2px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.logo .lt small{font-family:var(--font-d);font-size:8.5px;letter-spacing:3.6px;color:var(--dim);text-transform:uppercase;margin-top:3px}
.header-right{display:flex;align-items:center;gap:14px}
/* ===== 语言切换 ===== */
.lang-switch{position:relative;display:flex;align-items:center;height:36px;border:1px solid rgba(116,154,255,.38);border-radius:999px;overflow:hidden;cursor:pointer;user-select:none;background:rgba(33,230,255,.04);flex:none}
.lang-switch .pill{position:absolute;top:2px;bottom:2px;left:2px;width:calc(50% - 2px);border-radius:999px;background:var(--grad);z-index:1;transition:transform .32s ease;box-shadow:0 0 14px rgba(33,230,255,.4)}
.lang-switch .lg{position:relative;z-index:2;padding:0 14px;font-size:11.5px;letter-spacing:2px;font-weight:700;font-family:var(--font-d);color:var(--mut);transition:color .3s;line-height:36px}
body.lang-zh .lang-switch .pill{transform:translateX(100%)}
body.lang-zh .lang-switch .lg-en{color:var(--mut)}
body.lang-zh .lang-switch .lg-zh{color:#04121f}
body.lang-en .lang-switch .lg-en{color:#04121f}
body.lang-en .lang-switch .lg-zh{color:var(--mut)}
.info-wrap{position:relative}
.info-icon{width:40px;height:40px;border:1px solid rgba(116,154,255,.4);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--cy);font-family:var(--font-d);font-size:14px;font-weight:700;cursor:pointer;user-select:none;transition:.28s;background:rgba(33,230,255,.05)}
.info-icon:hover{background:var(--cy);color:#04121f;box-shadow:0 0 22px rgba(33,230,255,.5)}
.info-popup{position:absolute;top:44px;right:0;width:330px;background:rgba(8,13,26,.96);border:1px solid var(--line);backdrop-filter:blur(14px);padding:20px 22px;border-radius:4px;box-shadow:0 18px 50px rgba(2,4,10,.7);z-index:1000;opacity:0;visibility:hidden;transform:translateY(10px);transition:.3s}
.info-popup.show{opacity:1;visibility:visible;transform:none}
.info-popup h4{color:var(--cy);font-size:14px;letter-spacing:3px;margin-bottom:10px;font-weight:700}
.info-popup p{font-size:13px;line-height:1.8;color:var(--mut)}
/* ===== AI 设置 ===== */
.set-wrap{position:relative}
.set-btn{width:40px;height:40px;border:1px solid rgba(116,154,255,.4);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--cy);cursor:pointer;user-select:none;transition:.28s;background:rgba(33,230,255,.05)}
.set-btn:hover{background:var(--cy);color:#04121f;box-shadow:0 0 22px rgba(33,230,255,.5)}
.set-btn svg{width:18px;height:18px}
.model-wrap{position:relative}
.model-btn{display:flex;align-items:center;gap:6px;height:40px;padding:0 14px;border:1px solid rgba(33,230,255,.4);border-radius:999px;color:#bfeaff;background:rgba(33,230,255,.05);cursor:pointer;transition:.28s;font-family:var(--font-c);font-size:13px;letter-spacing:1px}
.model-btn .m-icon{width:22px;height:22px;border-radius:50%;object-fit:cover;flex:none}
.model-btn:hover{background:var(--cy);color:#04121f;box-shadow:0 0 22px rgba(33,230,255,.45)}
.model-btn svg{width:12px;height:12px;transition:transform .3s}
.model-wrap.open .model-btn svg{transform:rotate(180deg)}
.model-menu{position:absolute;top:46px;right:0;min-width:220px;background:rgba(8,13,26,.97);border:1px solid var(--line);backdrop-filter:blur(14px);padding:6px;display:flex;flex-direction:column;gap:4px;opacity:0;visibility:hidden;transform:translateY(8px);transition:.25s;z-index:1200;box-shadow:0 18px 50px rgba(2,4,10,.7)}
.model-wrap.open .model-menu{opacity:1;visibility:visible;transform:none}
.model-opt{padding:11px 14px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:.2s}
.model-opt:hover{background:rgba(33,230,255,.1)}
.model-opt .m-icon{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;border:1px solid rgba(116,154,255,.25)}
.model-opt .m-txt{display:flex;flex-direction:column;gap:2px}
.model-opt b{font-size:13.5px;color:#fff;letter-spacing:1px}
.model-opt small{font-size:11px;color:var(--dim)}
.model-opt.active{background:rgba(33,230,255,.12);border-left:2px solid var(--cy)}
.set-popup{position:absolute;top:44px;right:0;width:340px;background:rgba(8,13,26,.97);border:1px solid var(--line);backdrop-filter:blur(14px);padding:20px 22px;border-radius:4px;box-shadow:0 18px 50px rgba(2,4,10,.7);z-index:1000;opacity:0;visibility:hidden;transform:translateY(10px);transition:.3s;max-height:calc(100vh - 90px);overflow-y:auto}
.set-popup.show{opacity:1;visibility:visible;transform:none}
.set-popup h4{color:var(--cy);font-size:14px;letter-spacing:3px;margin-bottom:12px;font-weight:700}
.set-label{display:block;font-size:12px;color:var(--dim);letter-spacing:2px;margin:12px 0 6px}
.prov-row{display:flex;gap:8px;flex-wrap:wrap}
.prov{flex:1;min-width:120px;padding:9px 10px;font-size:12px;color:#bfeaff;background:rgba(33,230,255,.05);border:1px solid rgba(33,230,255,.35);cursor:pointer;transition:.3s;font-family:inherit}
.prov:hover{background:var(--cy);color:#04121f;box-shadow:0 0 16px rgba(33,230,255,.35)}
.set-in{width:100%;padding:10px 12px;font-size:13px;color:var(--ink);background:#101a30;border:1px solid rgba(116,154,255,.25);border-radius:4px;outline:none;font-family:var(--font-c)}
.set-in:focus{border-color:rgba(33,230,255,.6);box-shadow:0 0 12px rgba(33,230,255,.12)}
.set-actions{display:flex;gap:10px;margin-top:16px}
.mini-btn{flex:1;padding:11px 0;font-size:13.5px;letter-spacing:2px;cursor:pointer;color:var(--cy);background:none;border:1px solid rgba(33,230,255,.4);transition:.3s;font-family:inherit;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.mini-btn:hover{background:rgba(33,230,255,.1)}
.mini-btn.prim{color:#04121f;background:linear-gradient(100deg,#21e6ff,#3d7bff);border:none;font-weight:700}
.mini-btn.prim:hover{box-shadow:0 0 20px rgba(33,230,255,.4)}
.set-tip{font-size:11.5px;color:var(--dim);margin-top:12px;line-height:1.7}
/* ===== 角标体系 ===== */
.fr{position:relative}
.fr::before,.fr::after{content:"";position:absolute;width:22px;height:22px;border:0 solid var(--cy);pointer-events:none;z-index:5}
.fr::before{top:-1px;left:-1px;border-top-width:2px;border-left-width:2px}
.fr::after{bottom:-1px;right:-1px;border-bottom-width:2px;border-right-width:2px}
.fr i{position:absolute;width:20px;height:20px;border:0 solid var(--cy);pointer-events:none;z-index:5}
.fr i.cr1{top:-1px;right:-1px;border-top-width:2px;border-right-width:2px}
.fr i.cr2{bottom:-1px;left:-1px;border-bottom-width:2px;border-left-width:2px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
/* ===== 聊天区 ===== */
.chat-sec{position:relative;z-index:2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:110px clamp(12px,4vw,32px) 60px}
.chat-panel{position:relative;width:100%;max-width:920px;background:linear-gradient(170deg,rgba(14,21,42,.94),rgba(7,11,24,.98));border:1px solid var(--line);padding:24px 24px 20px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 80px rgba(2,5,14,.6)}
.chat-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.c-avatar{width:52px;height:52px;border-radius:50%;overflow:hidden;border:1px solid rgba(33,230,255,.45);box-shadow:0 0 22px rgba(33,230,255,.28);flex:none}
.c-avatar img{width:100%;height:100%;object-fit:cover}
.c-name{font-size:20px;font-weight:900;letter-spacing:2px;color:#fff;line-height:1.2}
.c-sub{font-family:var(--font-d);font-size:9px;letter-spacing:3px;color:var(--dim);text-transform:uppercase;margin-top:2px}
.stat{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:11.5px;letter-spacing:1px;padding:6px 13px;border:1px solid var(--line);border-radius:999px;color:var(--mut);cursor:pointer;user-select:none;transition:.3s}
.stat .dot{width:7px;height:7px;border-radius:50%;background:#5c7096}
.stat.on{border-color:rgba(33,230,255,.4);color:#bfeaff}
.stat.on .dot{background:var(--cy);box-shadow:0 0 8px var(--cy);animation:pulse 1.6s ease-in-out infinite}
.stat.off{border-color:rgba(255,176,32,.35);color:#ffc466}
.stat.off .dot{background:#ffb020}
.stat.think .dot{background:var(--vi);box-shadow:0 0 8px var(--vi);animation:pulse .8s ease-in-out infinite}
.clear-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:none;border:1px solid rgba(116,154,255,.35);color:var(--mut);font-size:12.5px;letter-spacing:1px;cursor:pointer;transition:.3s}
.clear-btn:hover{color:var(--cy);border-color:var(--cy);box-shadow:0 0 16px rgba(33,230,255,.3)}
.clear-btn svg{width:14px;height:14px}
.chat-box{height:440px;max-height:54vh;overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding:6px 4px 10px}
.msg{display:flex;gap:10px;max-width:84%;align-items:flex-end}
.msg.ai{align-self:flex-start}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.avatar{width:36px;height:36px;border-radius:50%;overflow:hidden;flex:none;border:1px solid rgba(33,230,255,.35);box-shadow:0 0 12px rgba(33,230,255,.18)}
.avatar img{width:100%;height:100%;object-fit:cover}
.bubble{padding:11px 15px;border-radius:4px;line-height:1.75;font-size:14.5px;word-break:break-word;white-space:pre-wrap}
.msg.ai .bubble{background:#16233f;border:1px solid rgba(116,154,255,.22);border-left:2px solid var(--cy)}
.msg.me .bubble{background:linear-gradient(100deg,#21e6ff,#3d7bff);color:#04121f;font-weight:500}
.msg.thinking .bubble{color:var(--dim)}
.input-area{display:flex;gap:10px}
#input{flex:1;background:#101a30;border:1px solid rgba(116,154,255,.25);border-radius:4px;color:#e9f1ff;padding:13px 16px;font-size:15px;outline:none;transition:.3s;font-family:inherit}
#input::placeholder{color:var(--dim)}
#input:focus{border-color:rgba(33,230,255,.6);box-shadow:0 0 16px rgba(33,230,255,.12)}
.icon-btn{width:52px;height:52px;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(33,230,255,.06);border:1px solid rgba(33,230,255,.38);color:var(--cy);cursor:pointer;transition:.3s;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.icon-btn:hover{background:var(--cy);color:#04121f;box-shadow:0 0 22px rgba(33,230,255,.4)}
.icon-btn svg{width:22px;height:22px}
.icon-btn.listening{background:var(--pk);color:#fff;border-color:var(--pk);box-shadow:0 0 22px rgba(255,46,136,.45)}
.send-btn{height:52px;flex:none;display:inline-flex;align-items:center;gap:8px;padding:0 26px;border:none;cursor:pointer;color:#04121f;font-size:15px;font-weight:700;letter-spacing:2px;background:linear-gradient(100deg,#21e6ff,#3d7bff);transition:.32s;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.send-btn:hover{box-shadow:0 0 30px rgba(33,230,255,.45);transform:translateY(-2px)}
.send-btn svg{width:17px;height:17px}
.chat-hint{margin-top:2px;display:flex;justify-content:center;gap:20px;color:var(--dim);font-size:12px;flex-wrap:wrap}
.chat-hint span{display:inline-flex;align-items:center;gap:6px}
.chat-hint svg{width:13px;height:13px;color:var(--cy)}
/* ===== 页脚 ===== */
footer{position:relative;z-index:2;background:var(--bg1);border-top:1px solid var(--line);padding:34px clamp(16px,5vw,40px);text-align:center}
footer p{font-size:13px;color:var(--dim)}
footer .disc{font-size:12px;margin-top:6px;opacity:.85}
/* ===== 响应式 ===== */
@media (max-width:600px){
  .chat-panel{padding:18px 14px 16px}
  .chat-box{height:52vh;max-height:52vh}
  .stat{margin-left:auto}
  .c-sub{display:none}
  .send-btn{padding:0 18px}
  .msg{max-width:92%}
  #input{font-size:16px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>

(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
var reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var fine=matchMedia("(pointer: fine)").matches;
/* ===== 国际化 ===== */
var I18N={
  "doc.title":{en:"AI Lezi - Smart Chat",zh:"AI乐子 - 智能聊天"},

(function(){
  if(reduce)return;
  var cv=$("#fx");if(!cv||!cv.getContext)return;
  var ctx=cv.getContext("2d");
  var W,H,ps=[],dpr=Math.min(devicePixelRatio||1,2);
  var COL=["33,230,255","61,123,255","138,92,255"];
  function resize(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+"px";cv.style.height=H+"px";ctx.setTransform(dpr,0,0,dpr,0,0)}
  function build(){
    var n=Math.max(30,Math.min(70,Math.round(W*H/26000)));
    ps=[];
    for(var i=0;i<n;i++){
      ps.push({x:Math.random()*W,y:Math.random()*H,r:0.6+Math.random()*1.7,vx:(Math.random()-.5)*.18,vy:-.06-Math.random()*.22,tw:.002+Math.random()*.012,ph:Math.random()*Math.PI*2,c:COL[Math.floor(Math.random()*COL.length)]});
    }
  }
  function frame(){
    ctx.clearRect(0,0,W,H);
    var t=Date.now()*.001;
    for(var i=0;i<ps.length;i++){
      var p=ps[i];
      p.x+=p.vx;p.y+=p.vy;p.ph+=p.tw;
      if(p.y<-12){p.y=H+12;p.x=Math.random()*W}
      if(p.x<-12)p.x=W+12;if(p.x>W+12)p.x=-12;
      var a=.16+Math.abs(Math.sin(p.ph+t))*0.5;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle="rgba("+p.c+","+a.toFixed(3)+")";ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  resize();build();
  addEventListener("resize",function(){resize();build()},{passive:true});
  requestAnimationFrame(frame);
})();

function addMsg(text,isMe){

    av.className="avatar";
    var im=document.createElement("img");

    av.appendChild(im);
    wrap.appendChild(av);
  }
  var bubble=document.createElement("div");
  bubble.className="bubble";
  bubble.textContent=text;
  wrap.appendChild(bubble);
  chatbox.appendChild(wrap);
  chatbox.scrollTop=chatbox.scrollHeight;

async function typeWrite(el,text,speed){
  speed=speed||22;
  el.textContent="";
  if(reduce){el.textContent=text;chatbox.scrollTop=chatbox.scrollHeight;return}
  for(var i=0;i<text.length;i++){
    el.textContent+=text.charAt(i);
    chatbox.scrollTop=chatbox.scrollHeight;
    await new Promise(function(r){setTimeout(r,speed)});
  }
}
async function aiReply(text){
  var bubble=addMsg("",false);

}

function localBrain(text){
  var low=text.toLowerCase();
  for(var i=0;i<KB.length;i++){
    var item=KB[i];
    for(var j=0;j<item.keys.length;j++){
      if(low.indexOf(item.keys[j])>=0){
        var ans=item.replies[Math.floor(Math.random()*item.replies.length)];
        if(ans==="now_time")return timeNow();
        if(ans==="now_date")return dateNow();
        if(ans==="now_week")return weekNow();
        return ans;
      }
    }
  }
  return null;
}
function weekNow(){
  var days=["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];

/* ===== 算式计算 ===== */
function calcMath(text){
  var reg=text.match(/[-+*/()0-9. ]+/);
  if(!reg)return null;
  var expr=reg[0].trim();
  if(!/^[0-9+\-*/(). ]+$/.test(expr))return null;
  try{
    var res=Function('"use strict";return ('+expr+')')();
    if(!isFinite(res))return null;
    return "算式 "+expr+" = "+res;
  }catch(e){return null}
}
/* ===== AI 服务（纯本地知识库） ===== */
var SYS_PROMPT="你是AI乐子";
async function askWorker(text){
  if(curModel!=="deepseek")return null;
  try{
    var r=await fetch("https://api.deepseek.com/v1/chat/completions",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer sk-764e117228ad471fb5c2f908dbc65aca"},
      body:JSON.stringify({model:"deepseek-chat",messages:[{role:"user",content:text}],max_tokens:500,temperature:0.7})
    });
    if(!r.ok)return null;
    var d=await r.json();
    return d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content||null;
  }catch(e){return null}
}

var modelBtn=$("#modelBtn"),modelMenu=$("#modelMenu"),modelLabel=$("#modelLabel"),modelIcon=$("#modelIcon");
function applyModel(m){
  curModel=m;
  try{localStorage.setItem("lezi.model",m)}catch(e){}
  var opt=document.querySelector('.model-opt[data-model="'+m+'"]');
  if(opt){
    modelLabel.textContent=opt.getAttribute("data-label");
    modelIcon.src=opt.getAttribute("data-icon");
  }
  $$(".model-opt").forEach(function(o){o.classList.toggle("active",o.getAttribute("data-model")===m)});
  modelMenu.parentElement.classList.remove("open");
}
modelBtn.addEventListener("click",function(e){e.stopPropagation();modelMenu.parentElement.classList.toggle("open")});

/* ===== 发送 ===== */
async function sendMessage(){
  var txt=inputDom.value.trim();
  if(!txt)return;
  inputDom.value="";
  addMsg(txt,true);
  var mathRes=calcMath(txt);
  if(mathRes){aiReply(mathRes);return}
  var got=null;
  setStat("think");
  got=await askWorker(txt);
  if(got){aiMode="on";setStat("on");aiReply(got);return}
  aiMode="off";setStat("off");
  var kb=localBrain(txt);
  aiReply(kb||fallbackReplies[Math.floor(Math.random()*fallbackReplies.length)]);
}
sendBtn.addEventListener("click",sendMessage);
inputDom.addEventListener("keydown",function(e){if(e.key==="Enter")sendMessage()});

/* ===== 语音 ===== */
var recognition=null,isListen=false;
if(window.webkitSpeechRecognition){
  recognition=new window.webkitSpeechRecognition();
  recognition.continuous=false;
  recognition.interimResults=false;
  recognition.lang="zh-CN";
  recognition.onresult=function(e){inputDom.value=e.results[0][0].transcript};
  recognition.onend=function(){isListen=false;micBtn.classList.remove("listening")};
  recognition.onerror=function(){isListen=false;micBtn.classList.remove("listening")};
}
micBtn.addEventListener("click",function(){
  if(!recognition){return}
  if(isListen){recognition.stop()}
  else{isListen=true;micBtn.classList.add("listening");try{recognition.start()}catch(e){isListen=false;micBtn.classList.remove("listening")}}
});
